name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: joeycastillo/theos-action@main
      with:
        sdk-version: "16.5"

    - name: Build
      run: |
        make package FINALPACKAGE=1
        ls -lh packages/

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: FeishuAutoStatus-deb
        path: packages/*.deb
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
