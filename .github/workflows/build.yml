name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (Theos)
    runs-on: macos-14

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🍺 Install dependencies
        run: |
          brew install ldid make perl rsync
          brew install dpkg

      - name: 🔧 Setup Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown -R $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> "$GITHUB_ENV"
          echo "THEOS_PACKAGE_SCHEME=rootless" >> "$GITHUB_ENV"

      - name: 📱 Setup iOS SDK
        run: |
          cd /opt/theos
          git clone --recursive https://github.com/theos/sdks.git sdks 2>/dev/null || true
          ls -la /opt/theos/sdks/ || true

      - name: 🔨 Prepare project
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== Makefile ==="
          cat Makefile
          echo "=== Tweak.x (first 20 lines) ==="
          head -20 Tweak.x

      - name: 🏗️ Build tweak
        run: |
          export THEOS=/opt/theos
          export THEOS_PACKAGE_SCHEME=rootless
          export PATH="/opt/theos/bin:$PATH"
          make clean 2>/dev/null || true
          echo "=== Building ==="
          make package 2>&1 || {
            echo "❌ Build failed, trying with debug output..."
            make package DEBUG=1 2>&1
            exit 1
          }
          echo "=== Build successful! ==="

      - name: 📋 List build artifacts
        run: |
          echo "=== Packages ==="
          ls -la packages/ 2>/dev/null || echo "No packages directory"
          echo "=== .deb files ==="
          find . -name "*.deb" -type f 2>/dev/null || echo "No .deb files"

      - name: 📤 Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeishuAutoStatus-deb
          path: |
            packages/*.deb
            .theos/packages/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: 📤 Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .theos/
          if-no-files-found: warn
          retention-days: 7
