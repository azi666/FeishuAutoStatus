name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v3
      
    - name: 安装Theos
      run: |
        export THEOS=~/theos
        if [ ! -d "$THEOS" ]; then
          git clone --recursive https://github.com/theos/theos.git $THEOS
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
    - name: 配置Theos环境
      run: |
        echo "export THEOS=~/theos" >> ~/.bash_profile
        echo "export PATH=\$THEOS/bin:\$PATH" >> ~/.bash_profile
        source ~/.bash_profile
        
    - name: 编译主Tweak
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:$PATH
        make clean || true
        make package FINALPACKAGE=1
        
    - name: 编译偏好设置Bundle
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:$PATH
        cd feishuautostatusprefs
        make clean || true
        make FINALPACKAGE=1
        cd ..
        
    - name: 收集构建产物
      run: |
        mkdir -p artifacts
        cp packages/*.deb artifacts/ || true
        ls -lh artifacts/
        
    - name: 上传deb包
      uses: actions/upload-artifact@v3
      with:
        name: FeishuAutoStatus-deb
        path: artifacts/*.deb
        retention-days: 90
        
    - name: 创建Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*.deb
        body: |
          ## FeishuAutoStatus - 飞书自动状态切换插件
          
          ### 功能特性
          - ✅ 自动定时切换飞书在线状态
          - ⏰ 支持工作时间判断（工作日8:00-17:30）
          - 🌙 非工作时间自动设置为休息状态
          - ⚙️ 可自定义工作时间和状态文本
          - 📱 集成系统设置界面
          
          ### 安装方法
          ```bash
          # 下载deb文件后，通过SSH安装到越狱设备
          scp *.deb root@设备IP:/tmp/
          ssh root@设备IP "dpkg -i /tmp/*.deb"
          ```
          
          ### 配置说明
          打开 **设置 → 飞书自动状态** 进行配置
          
          ---
          自动构建于 ${{ github.event.head_commit.timestamp }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
