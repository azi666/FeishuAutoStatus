name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        set -e
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: Install iOS SDK
      run: |
        set -e
        wget -q https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz
        tar xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/

    - name: Build
      run: |
        set -e
        make package FINALPACKAGE=1
        ls -lh packages/

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: FeishuAutoStatus-deb
        path: packages/*.deb
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: packages/*.deb
        body: |
          ## 飞书自动状态切换插件

          ### 安装
          1. 下载.deb，用Filza安装
          2. `killall -9 SpringBoard`

          ### 查看日志
          ```bash
          log stream --predicate 'processImagePath contains "Lark"' | grep FeishuAutoStatus
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
